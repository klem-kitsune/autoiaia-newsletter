name: AutoIAia Daily Pipeline

on:
  schedule:
    - cron: '0 8 * * *' # Ejecución diaria automática a las 08:00 AM
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install feedparser

      - name: Execute Autonomous Script
        run: python auto_content.py
